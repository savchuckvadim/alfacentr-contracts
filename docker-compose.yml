# =============================================================================
#  Прод Alfacentr. Образы собирает GitHub Actions и кладёт в GHCR, сервер
#  только скачивает их (.github/workflows/deploy-alfa-prod.yml).
#
#  Какая версия запущена, решают FRONT_TAG и API_TAG в корневом .env на
#  сервере. Деплой сам вписывает туда sha выкаченного коммита, а в
#  FRONT_TAG_PREV и API_TAG_PREV — версию, работавшую до него. Поэтому ручной
#  `docker compose up -d` поднимает ровно выкаченные версии.
#
#  Откат одного сервиса на предыдущую версию. Её образ деплой оставляет на
#  сервере, так что доступ к GHCR не нужен:
#    1. в корневом .env заменить значение API_TAG на значение API_TAG_PREV
#    2. docker compose up -d --no-deps api-alfacentr
#  Откат на версию старше предыдущей: скачивать с сервера бесполезно, GHCR
#  отдаёт ~85 КБ/с. Скачать образ на любой машине с нормальным каналом и
#  передать по SSH (так же доставляет образы и деплой):
#    docker pull ghcr.io/savchuckvadim/alfacentr-api:<sha>
#    docker save ghcr.io/savchuckvadim/alfacentr-api:<sha> | gzip | ssh root@сервер 'gunzip | docker load'
#  затем вписать sha в API_TAG и docker compose up -d --no-deps api-alfacentr.
#  Перезапуск старого запуска в GitHub Actions для отката не годится: деплой
#  откажется выкатывать коммит старее уже выкаченного.
#
#  Сборка на самом сервере, если GitHub недоступен (аварийный путь):
#    docker compose -f docker-compose.yml -f docker-compose.build.yml build api-alfacentr
#    docker compose up -d --no-deps api-alfacentr
# =============================================================================

services:

  front-alfacentr:
    image: ghcr.io/savchuckvadim/alfacentr-front:${FRONT_TAG:-latest}
    container_name: front-alfacentr-prod
    ports:
      - "${PORT_ALFA}:3000"
    # Переменные окружения фронту не нужны: standalone-сервер после сборки
    # их не читает, а NEXT_PUBLIC_NODE_MODE встроен в бандл при сборке
    restart: unless-stopped
    # Любой ответ ниже 500 считаем живым: корень может отдавать редирект
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app-network-alfacentr

  api-alfacentr:
    image: ghcr.io/savchuckvadim/alfacentr-api:${API_TAG:-latest}
    container_name: nest-api-alfacentr
    ports:
      - "${PORT_API_ALFA}:3000"
    # Эти значения важнее одноимённых ключей из apps/back/.env:
    # ConfigModule не перезаписывает то, что уже есть в окружении процесса
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis-alfacentr
      - REDIS_PORT=6379
      - PORT=3000
    depends_on:
      - redis-alfacentr
    restart: unless-stopped
    volumes:
      - ./apps/back/keys:/app/keys
      - ./apps/back/storage:/app/storage
      - ./logs:/app/logs
      # .env бэка живёт только на сервере и в образ не попадает. ConfigModule
      # читает /app/.env, как и раньше. После правки файла достаточно
      # `docker restart nest-api-alfacentr`, пересборка не нужна.
      # create_host_path: false — если файла нет, контейнер не стартует.
      # Иначе Docker молча создал бы на его месте пустой каталог
      - type: bind
        source: ./apps/back/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    # /api/health отдает {status: ok}; глобальный префикс api задан в main.ts
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app-network-alfacentr

  # Том /data у redis анонимный, его объявляет сам образ. Пересоздание через
  # `up` том сохраняет, а `docker compose down` и `rm` его теряют. Там лежат
  # очередь Bull генерации документов и реестр операторов бота. Поэтому деплой
  # redis не пуллит и не пересоздаёт. Не добавлять сюда именованный том без
  # переноса /data/dump.rdb: контейнер пересоздастся с пустой базой
  redis-alfacentr:
    image: redis:7
    container_name: redis-alfacentr
    ports:
      - "${ALFA_REDIS_PORT}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - app-network-alfacentr

networks:
  app-network-alfacentr:
    driver: bridge
    name: app-network-alfacentr
