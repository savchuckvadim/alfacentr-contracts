services:


  front-alfacentr:
    image: alfacentr-front:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.front
      args:
        APP: front
      # cache_from убран намеренно: билдер mybuilder работает на драйвере
      # docker-container и не видит локальные образы демона, поэтому строка
      # с локальным тегом трактовалась как ссылка на реестр и на каждой сборке
      # давала "pull access denied". Кеш слоев берется из кеша самого билдера.
    container_name: front-alfacentr-prod
    ports:
      - "${PORT_ALFA}:3000"         # API доступен снаружи
    environment:
      - IN_BITRIX=true
      - LOG_FILE_PATH=/app/logs/server.log
      - NEXT_PUBLIC_NODE_MODE=${NODE_MODE}

    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    # Без проверки живости цикл ожидания в деплое видит health=none и считает
    # готовым любой запустившийся контейнер, даже падающий на первом запросе.
    # Любой ответ ниже 500 считаем живым: корень может отдавать 403 или редирект
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app-network-alfacentr


  api-alfacentr:
    image: alfacentr-api:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.back
      args:
        APP: back
      # cache_from убран, причина та же, что и у фронта выше

    container_name: nest-api-alfacentr
    ports:
      - "${PORT_API_ALFA}:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis-alfacentr
      - REDIS_PORT=6379
      - PORT=3000

               # для app.listen
    depends_on:
      - redis-alfacentr
    restart: unless-stopped

    volumes:
      - ./apps/back/keys:/app/keys
      - ./apps/back/storage:/app/storage
      - ./logs:/app/logs
    # /api/health отдает {status: ok}; глобальный префикс api задан в main.ts
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app-network-alfacentr

  redis-alfacentr:
    image: redis:7
    container_name: redis-alfacentr
    ports:
      - "${ALFA_REDIS_PORT}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - app-network-alfacentr

