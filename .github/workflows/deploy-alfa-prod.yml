name: Monorepo on push to main

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 120

        steps:
            - name: ✅ CI запущен
              run: echo "🚀 Alfacentr monorepo GitHub Actions запущен"

            - name: Deploy to server via SSH
              uses: appleboy/ssh-action@v0.1.10
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                  # timeout — только установка SSH-соединения, не выполнение скрипта
                  timeout: 60s
                  # command_timeout — предел на весь скрипт. После первого удачного
                  # прогона с прогретым кешем можно снижать до 45m
                  command_timeout: 90m

                  debug: true
                  script: |
                      set -eu
                      echo "🧩 Подключение к серверу Alfacentr"
                      cd /var/www/html/alfacentr

                      # ---------------------------------------------------------------
                      #  Отметка последнего УСПЕШНОГО деплоя.
                      #
                      #  Раньше здесь сравнивались коммиты до и после git pull. Если
                      #  сборка падала уже после pull, репозиторий оставался на новом
                      #  коммите, а образ — на старом. Следующий запуск видел, что
                      #  коммиты совпадают, и выходил с успехом, ничего не собрав.
                      #  Прод при этом работал на старом коде, а CI горел зелёным.
                      #  Теперь ориентир — то, что реально выкачено, а не то, что скачано.
                      # ---------------------------------------------------------------
                      STATE_DIR="$HOME/.alfacentr-deploy"
                      STATE_FILE="$STATE_DIR/last_success_sha"
                      mkdir -p "$STATE_DIR"

                      DIRTY=$(git status --porcelain --untracked-files=no || true)
                      if [ -n "$DIRTY" ]; then
                        echo "❌ Рабочее дерево на сервере грязное, git pull может не пройти:"
                        echo "$DIRTY"
                        exit 1
                      fi

                      git pull origin main
                      COMMIT_AFTER=$(git rev-parse HEAD)
                      echo "📌 Текущий коммит: $COMMIT_AFTER"

                      BASE_SHA=$(cat "$STATE_FILE" 2>/dev/null || true)
                      BOOTSTRAP=false
                      if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                        BOOTSTRAP=true
                      fi

                      need_back=false
                      need_front=false

                      if [ "$BOOTSTRAP" = true ]; then
                        # Состояние прод-образов неизвестно: собираем всё.
                        # Пропускать сборку по diff здесь нельзя — можно навсегда
                        # потерять изменения, которые не доехали до образа
                        echo "ℹ️  Отметки успешного деплоя нет — собираю оба сервиса"
                        need_back=true
                        need_front=true
                      elif [ "$BASE_SHA" = "$COMMIT_AFTER" ]; then
                        echo "✅ Этот коммит уже успешно выкачен — делать нечего"
                        docker compose ps || true
                        exit 0
                      else
                        CHANGED=$(git diff --name-only "$BASE_SHA" "$COMMIT_AFTER")
                        echo "📂 Изменения с последнего успешного деплоя:"
                        echo "$CHANGED" | head -n 50

                        # Пути, которые ни на один образ не влияют: документация,
                        # отчёты, сам workflow. Раньше коммит с одними отчётами
                        # не совпадал ни с одним шаблоном и по запасной ветке
                        # пересобирал ОБА сервиса
                        MEANINGFUL=$(echo "$CHANGED" | grep -vE '^(docs/|\.github/|[^/]*\.(md|docx|doc|pdf|xlsx)$|deploy\.yml$|analyze-time\.ps1$|desktop\.ini$)' || true)

                        if [ -z "$MEANINGFUL" ]; then
                          echo "ℹ️  Изменилась только документация — сборка не нужна"
                          printf '%s\n' "$COMMIT_AFTER" > "$STATE_FILE"
                          docker compose ps || true
                          exit 0
                        fi

                        if echo "$MEANINGFUL" | grep -qE '^(apps/back/|docker/Dockerfile\.back|packages/)'; then
                          need_back=true
                        fi
                        if echo "$MEANINGFUL" | grep -qE '^(apps/front/|docker/Dockerfile\.front|packages/)'; then
                          need_front=true
                        fi
                        if echo "$MEANINGFUL" | grep -qE '^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|turbo\.json|nx\.json|\.dockerignore|docker-compose\.yml|docker-compose-full\.yml|docker-compose-test\.yml)$'; then
                          need_back=true
                          need_front=true
                        fi

                        if [ "$need_back" = false ] && [ "$need_front" = false ]; then
                          echo "⚠️ Изменения не совпали ни с одним шаблоном — пересобираю оба (безопасный запасной вариант)"
                          need_back=true
                          need_front=true
                        fi
                      fi

                      echo "🧭 План: backend=$need_back frontend=$need_front"

                      echo "🔍 Проверяю Docker Compose v2..."
                      docker compose version

                      export DOCKER_BUILDKIT=1
                      # BUILDKIT_INLINE_CACHE как переменная окружения — пустышка,
                      # это аргумент сборки. Убрана, чтобы не вводить в заблуждение

                      # Базовые образы обновляем, кеш приложений не трогаем
                      docker compose pull redis-alfacentr || true
                      # --no-deps ниже redis не поднимет, поднимаем отдельно
                      docker compose up -d redis-alfacentr || true

                      # ---------------------------------------------------------------
                      #  Сборка и выкатка одного сервиса.
                      #
                      #  Раньше сначала собирались оба образа и только потом поднимались.
                      #  Из-за этого падение фронта оставляло бэкенд собранным, но
                      #  невыкаченным. Теперь каждый сервис поднимается сразу после
                      #  своей сборки и не ждёт соседа
                      # ---------------------------------------------------------------
                      deploy_service() {
                        svc="$1"
                        cname="$2"

                        old_id=$(docker ps -aq --filter "name=^/${cname}$" | head -n1)

                        echo "⏳ Сборка $svc..."
                        if ! docker compose build "$svc"; then
                          echo "❌ Сборка $svc не удалась"
                          docker compose logs --tail 200 "$svc" || true
                          return 1
                        fi

                        echo "⏳ Запускаю $svc (redis не трогаю)"
                        if ! docker compose up -d --no-deps "$svc"; then
                          echo "❌ Запуск $svc не удался"
                          docker compose logs --tail 200 "$svc" || true
                          return 1
                        fi

                        echo "⏳ Жду running/healthy для $svc..."
                        timeout=900
                        elapsed=0
                        while true; do
                          new_id=$(docker ps -aq --filter "name=^/${cname}$" | head -n1)
                          status=$(docker inspect -f '{{.State.Status}}' "$new_id" 2>/dev/null || echo "missing")
                          health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$new_id" 2>/dev/null || echo "unknown")

                          if [ -n "$new_id" ] && [ "$status" = "running" ] && \
                             { [ "$health" = "healthy" ] || [ "$health" = "none" ]; } && \
                             { [ -z "$old_id" ] || [ "$new_id" != "$old_id" ]; }; then
                            echo "✅ $svc: $old_id -> $new_id (status=$status, health=$health)"
                            return 0
                          fi

                          if [ "$health" = "unhealthy" ]; then
                            echo "❌ $svc не прошёл проверку живости"
                            docker logs "$cname" --tail 200 || true
                            return 1
                          fi

                          if [ "$elapsed" -ge "$timeout" ]; then
                            echo "❌ Таймаут ожидания $svc (status=$status, health=$health)"
                            docker logs "$cname" --tail 200 || true
                            return 1
                          fi

                          echo "⌛ Жду $svc... elapsed=${elapsed}s status=$status health=$health"
                          sleep 5
                          elapsed=$((elapsed + 5))
                        done
                      }

                      rc=0
                      if [ "$need_back" = true ]; then
                        deploy_service api-alfacentr nest-api-alfacentr || rc=1
                      fi
                      if [ "$need_front" = true ]; then
                        deploy_service front-alfacentr front-alfacentr-prod || rc=1
                      fi

                      docker compose ps || true

                      if [ "$rc" -ne 0 ]; then
                        echo "❌ Деплой завершился с ошибкой — отметка успеха НЕ обновляется,"
                        echo "   следующий запуск повторит сборку с того же места"
                        exit 1
                      fi

                      printf '%s\n' "$COMMIT_AFTER" > "$STATE_FILE"
                      echo "🏁 Деплой успешен, отметка обновлена: $COMMIT_AFTER"

                      # Чистим только висячие образы и только после успеха.
                      # Кеш билдера (docker buildx prune) не трогаем — он и есть
                      # то, что делает следующую сборку быстрой
                      docker image prune -f || true

                      [ "$need_back" = true ] && docker logs nest-api-alfacentr --tail 100 || true
                      [ "$need_front" = true ] && docker logs front-alfacentr-prod --tail 100 || true
